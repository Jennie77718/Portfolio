(()=>{const D=["fs/","im/","media/","media/fs/","media/im/"];

<script>
/* About: Typo mit Zahlen (schwarz auf weiß). Schrift hebt sich beim Hovern kurz, Zahlen drehen sich nacheinander. */
(()=>{
 const box=document.getElementById('atype'),TX=document.getElementById('atx'),NM=document.getElementById('anm');
 const NS='http://www.w3.org/2000/svg',mk=(g,t)=>g.appendChild(document.createElementNS(NS,t));
 const LINES=[["Hel",.93,.27],["lo,",.945,.41],["I'm",.84,.55],["Jen",.925,.69],["nie.",.86,.83]],FS=.30;
 const NUMS=[["22-3",.648,.078],["22-4",.818,.078],["22-5",.648,.208],["23-8",.648,.428],["27-7",.648,.745],["27-8",.818,.745]];
 const tx=LINES.map(l=>{const e=mk(TX,'text');e.textContent=l[0];e.setAttribute('text-anchor','end');
   e.addEventListener('mouseenter',()=>{if(e.classList.contains('up'))return;e.classList.add('up');e.addEventListener('animationend',()=>e.classList.remove('up'),{once:true})});return e});
 const nm=NUMS.map(n=>{const e=mk(NM,'text');e.textContent=n[0];return e});
 function layout(){
  const W=box.clientWidth||innerWidth,H=box.clientHeight||innerHeight;
  const side=innerWidth<900?Math.min(W,H):Math.min(W*.55,H),x0=W-side-(innerWidth<900?0:W*.02),y0=(H-side)/2;box.style.setProperty('--hside',(side+W*.02)+'px');
  tx.forEach((e,i)=>{e.setAttribute('x',x0+LINES[i][1]*side);e.setAttribute('y',y0+LINES[i][2]*side);e.setAttribute('font-size',FS*side)});
  nm.forEach((e,i)=>{e.setAttribute('x',x0+NUMS[i][1]*side);e.setAttribute('y',y0+NUMS[i][2]*side);e.setAttribute('font-size',Math.max(10,.012*side))});
 }
 let ni=0,iv=0;
 function spinNext(){const e=nm[ni];e.classList.remove('spin');void e.getBBox();e.classList.add('spin');ni=(ni+1)%nm.length}
 addEventListener('resize',()=>{if(iv)layout()});
 window.ABOUT={start(){if(iv)return;layout();requestAnimationFrame(layout);iv=setInterval(spinNext,1000)},stop(){clearInterval(iv);iv=0}};
})();

/* Startseite: Fließtext-Blöcke im Hintergrund (Platzhalter, später ersetzen) + silberne Ranken, die sich ganz langsam bewegen */
/* Hintergrundtexte: hier eigene Texte einfügen (eine Zeile = ein Vers). Sie werden in zufällig lange Absätze mit unterschiedlichen Lücken aufgeteilt. */
const HOME_BG_TEXTS=[
`Ich öffne die Tür,
doch meine Schatten bleiben sitzen.
Dein Lächeln kennt jede Regel,
die ich nie unterschreiben wollte.
Ich will atmen,
ohne zuerst zu fragen,
ob der Raum mir gehört.
Ich will gehen,
auch wenn die Straße leer aussieht.
Draußen wartet kein Versprechen,
nur Wind und ein neuer Name.
Und trotzdem:
Ich möchte nicht allein sein.
Ich möchte frei sein –
und lernen, es auch zu bleiben.`,
`Oh, meine Liebe,
dein Name liegt wie warmes Licht
auf einem langen Tag.
Ich denke an deine Hände,
an die Ruhe in deiner Stimme,
an all die kleinen Momente,
die niemand sonst sieht.
Wenn die Stadt schläft,
bleibt dein Lächeln wach in mir.
Ich hätte so gern
noch einen Abend mit dir –
nicht wegen der Worte,
sondern weil die Welt
bei dir leiser wird.`,
`Eine Melodie ruft,
sanft wie ein Versprechen.
Sie kennt den Weg zu dir,
bevor du ihn selbst findest.
Komm, sagt sie,
nur einen Moment.
Doch aus einem Moment
wird eine ganze Nacht.
Die Bücher warten,
die Träume auch.
Und irgendwo zwischen Beifall und Bildschirm
vergisst du fast dein eigenes Gesicht.
Ich liebe dich dafür,
dass du mir folgst.
Ich fürchte mich davor,
dass du dich verlierst.
Also hör mich,
aber hör vor allem dich:
Die schönste Musik
ist die, nach der du weitergehst.`,
`Sie sagen, es sei zu weit.
Sie sagen, du seist zu laut.
Sie messen dein Leben
mit ihren kleinen Linealen.
Doch was, wenn ich nicht passe?
Was, wenn mein Herz
eine andere Richtung kennt?
Ich habe genug Zäune gesehen,
genug Türen, die sich schließen.
Heute baue ich keine Mauern mehr –
ich gehe einfach weiter.
Der Himmel fragt nicht,
ob du erlaubt bist zu träumen.
Der Wind fragt nicht,
ob du laut genug lachst.
Also lass sie reden.
Lass die Zweifel ziehen.
Mein Leben gehört mir,
und ich lebe es jetzt.`
];
(()=>{
 const bg=document.getElementById('hbg');
 const RR=(a,b)=>a+Math.random()*(b-a),LN=HOME_BG_TEXTS.flatMap(t=>t.split(/\n/).map(x=>x.trim()).filter(Boolean)),PP=[];
 for(let i=0,k=0;PP.length<70&&LN.length;k++){const n=Math.round(RR(2,7)),ch=[];for(let j=0;j<n;j++)ch.push(LN[(i+j)%LN.length]);i+=n;PP.push(ch.join("<br>"))}
 bg.innerHTML=PP.map(t=>`<p class="${Math.random()<.14?"m":""}" style="margin:0 0 ${Math.round(RR(6,120))}px">${t}</p>`).join("");

{n:"Props Babylon Berlin",t:[6,9],pr:1,o:2,y:2026,fr:["Semester project, in partnership with Josefin Steiner and in collaboration with Schein Kollektiv","학기 프로젝트, 요제핀 슈타이너와 파트너십, 샤인 콜렉티브와 협업","Semesterprojekt, in Partnerschaft mit Josefin Steiner und in Kollaboration mit Schein Kollektiv"],ro:["Type design, concept, layout, print, photography","서체 개발, 콘셉트, 레이아웃, 인쇄, 사진","Schriftentwicklung, Konzept, Layout, Print, Fotografie"],sw:"Illustrator, InDesign, Photoshop",im:"bb_02",st:["bb_01"],bg:"#efe3c8",fg:"#000",
 d:[["For the fifth season of the series Babylon Berlin, we created graphic props for the KPD district office of the character Liselotte Storch. We worked in collaboration with Schein Kollektiv, a company that produces graphic props for productions such as The Hunger Games and Babylon Berlin.","Our task was to design various documents and printed materials that would fit convincingly into the historical setting shortly before the Nazi seizure of power in 1933. The main challenge was to make the props look new and well preserved while still conveying the characteristic historical and old-fashioned aesthetic of the period."],
    ["시리즈 《바빌론 베를린》 시즌 5를 위해 등장인물 리젤로테 슈토르히의 KPD 지역 사무소에 쓰일 그래픽 소품을 제작했습니다. 《헝거 게임》, 《바빌론 베를린》 등의 작품에 그래픽 소품을 제작하는 회사 샤인 콜렉티브(Schein Kollektiv)와 협업했습니다.","1933년 나치 집권 직전의 역사적 배경에 설득력 있게 어울리는 다양한 문서와 인쇄물을 디자인하는 것이 과제였습니다. 가장 큰 도전은 소품을 새것처럼 잘 보존된 상태로 보이게 하면서도 그 시대 특유의 역사적이고 고풍스러운 미감을 전달하는 것이었습니다."],
    ["Für die fünfte Staffel der Serie Babylon Berlin haben wir grafische Requisiten für das KPD-Bezirksbüro der Figur Liselotte Storch gestaltet. Dabei haben wir mit Schein Kollektiv zusammengearbeitet, einem Unternehmen, das grafische Requisiten für Produktionen wie Die Tribute von Panem und Babylon Berlin herstellt.","Unsere Aufgabe war es, verschiedene Dokumente und Drucksachen zu gestalten, die sich überzeugend in das historische Setting kurz vor der Machtergreifung 1933 einfügen. Die größte Herausforderung bestand darin, die Requisiten neu und gut erhalten wirken zu lassen und trotzdem die typische historische, altmodische Ästhetik der Zeit zu vermitteln."]],

{n:"Inyeon",t:[1,9],iy:1,o:4,y:2026,fr:["Three-hour exercise to develop a handful of layouts","몇 가지 레이아웃을 만들기 위한 3시간 실습","Dreistündige Übung, um eine Handvoll Layouts zu entwickeln"],ro:["Concept, text, layout, photography (all photos are my own), print","콘셉트, 텍스트, 레이아웃, 사진(모든 사진 직접 촬영), 인쇄","Konzept, Text, Layout, Fotografie (alle Fotos sind von mir), Print"],sw:"InDesign, Photoshop, Lightroom",st:["iy_cover"],bg:"#acb6be",fg:"#000",
 d:[["Inyeon (인연) is a Korean word for the invisible thread between people who are meant to meet. The task of the exercise was to design any week of the year in at least twelve layouts.","I decided to include it in my portfolio to show the more personal side of me."],
    ["인연은 만나야 할 사람들 사이를 잇는 보이지 않는 실을 뜻하는 한국어입니다. 이 실습의 과제는 1년 중 원하는 한 주를 최소 12개의 레이아웃으로 디자인하는 것이었습니다.","저의 더 개인적인 모습을 보여 드리고 싶어 이 작업을 포트폴리오에 넣기로 했습니다."],
    ["Inyeon (인연) ist ein koreanisches Wort für den unsichtbaren Faden zwischen Menschen, die sich begegnen sollen. Aufgabe der Übung war es, eine beliebige Woche im Jahr in mindestens zwölf Layouts zu gestalten.","Ich habe mich entschieden, es in mein Portfolio aufzunehmen, um meine persönlichere Seite zu zeigen."]]},
{n:"Dasein",t:[2],ph:1,o:3,y:2025,fr:["End-of-semester submission, photography course, 2 weeks","학기 말 과제, 사진 수업, 기간 2주","Endsemesterabgabe, Fotografiekurs, Zeitraum 2 Wochen"],ro:["Photographer, communication","사진, 커뮤니케이션","Fotografin, Kommunikation"],sw:"Lightroom",st:["person2_03"],im:"person2_03",hero:"IMG_1069",bg:"#000",fg:"#fff",d:[["Hospice is not only a place of farewell.\\nIt is a place where we encounter life: openly, honestly, and without restraint.\\nMrs. Franke and Mr. Schulze showed me what that truly means. They fill their days with humor and warmth, finding joy in life even during the most difficult moments.", "Mr. Schulze once said, “Sometimes I still hope that something in my mind will click and that everything will be alright again.” Four days later, he passed away.\\nSome words stay with us. So do some people. They remind us how fragile life is and how beautiful it can be when we are still able to feel it."],["호스피스는 작별의 장소만이 아닙니다.\\n그곳은 삶을 마주하는 곳입니다. 솔직하게, 정직하게, 거침없이.\\n프랑케 부인과 슐체 씨는 그것이 무슨 뜻인지 저에게 보여 주었습니다. 두 분은 유머와 따뜻함으로 하루하루를 채우고, 가장 힘든 순간에도 삶의 기쁨을 찾아냅니다.", "슐체 씨는 이렇게 말한 적이 있습니다. “가끔은 내 머릿속에서 무언가 딸깍 하고 맞아떨어져서 모든 게 다시 괜찮아지기를 아직도 바라요.” 나흘 뒤, 그는 세상을 떠났습니다.\\n어떤 말은 우리 곁에 남습니다. 어떤 사람도 그렇습니다. 그들은 삶이 얼마나 깨지기 쉬운지, 그리고 우리가 아직 그것을 느낄 수 있을 때 얼마나 아름다울 수 있는지를 일깨워 줍니다."],["Das Hospiz ist nicht nur ein Ort des Abschieds.\\nEs ist ein Ort, an dem wir dem Leben begegnen: offen, ehrlich und ohne Zurückhaltung.\\nFrau Franke und Herr Schulze haben mir gezeigt, was das wirklich bedeutet. Sie füllen ihre Tage mit Humor und Wärme und finden selbst in den schwersten Momenten Freude am Leben.","Herr Schulze sagte einmal: „Manchmal hoffe ich noch, dass in meinem Kopf etwas klick macht und alles wieder gut wird.“ Vier Tage später ist er gestorben.\\nManche Worte bleiben. Manche Menschen auch. Sie erinnern uns daran, wie zerbrechlich das Leben ist und wie schön es sein kann, solange wir es noch spüren."]]},
{n:"Editorial Shoot",t:[2],o:7,fs:1,y:2025,fr:["Semester project, photography","학기 프로젝트, 사진","Semesterprojekt Fotografie"],sw:"Lightroom",ro:["Photographer, concept","사진, 콘셉트","Fotografin, Konzept"],st:["ph_02"],bg:"#ddd",fg:"#000",
 d:[["In collaboration with a fashion designer and model, I conceptualized and produced the editorial shoot. As art director and photographer, I developed the visual concept, directed the models and established the project's overall aesthetic.","Drawing on Berlin's nightlife, Joe Strassner and the opulent sensuality of the 1920s, the series explores femininity as confident, playful and self-determined. The imagery portrays women who embrace their sexuality and sensuality for themselves rather than for the gaze of others."],
    ["패션 디자이너, 모델과 협업하여 에디토리얼 촬영을 기획하고 제작했습니다. 아트 디렉터이자 포토그래퍼로서 비주얼 콘셉트를 개발하고, 모델을 디렉팅하며, 프로젝트 전체의 미감을 구축했습니다.","베를린의 밤 문화, 요 슈트라스너, 그리고 1920년대의 화려한 관능에서 영감을 받은 이 시리즈는 자신감 있고 유쾌하며 주체적인 여성성을 탐구합니다. 이미지 속 여성들은 타인의 시선이 아닌 자기 자신을 위해 섹슈얼리티와 관능을 받아들입니다."],
    ["In Zusammenarbeit mit einer Modedesignerin und einem Model habe ich das Editorial-Shooting konzipiert und produziert. Als Art Director und Fotografin habe ich das visuelle Konzept entwickelt, die Models angeleitet und die Gesamtästhetik des Projekts geprägt.","Inspiriert vom Berliner Nachtleben, von Joe Strassner und der opulenten Sinnlichkeit der 1920er-Jahre erkundet die Serie Weiblichkeit als selbstbewusst, verspielt und selbstbestimmt. Die Bilder zeigen Frauen, die ihre Sexualität und Sinnlichkeit für sich selbst leben und nicht für den Blick anderer."]]},
{n:"Heim",t:[2],o:1,hd:"ph_03",bg:"#ddd",fg:"#000",d:["Preview – this project will be uploaded soon.","미리보기 – 이 프로젝트는 곧 업로드됩니다."]},
{n:"Trenn dich",t:[3,4,0],o:1,y:2026,ro:["Concept, strategy, programming, presentation","콘셉트, 전략, 프로그래밍, 발표","Konzept, Strategie, Programmieren, Vortrag"],sw:"Visual Studio Code",tool:"bsr-tool.html",film:"bsr-aufruf",loops:[["bsr-feed",.5625],["bsr-praesentation.jpg",1.5],["bsr-unsorted",.7492]],hv:"mm_v",st:["mm_v"],bg:"#efe9dc",fg:"#000",
 d:[["For the BSR, Berlin's city cleaning service, we developed a fictional campaign that aims to raise awareness of waste separation, especially among young people, for whom it will matter more and more as climate change and global warming become increasingly urgent.","At its heart is a generative tool built on the principle of a trash alphabet, which turns words into posters and social media posts. Our vision is for the tool to live on the BSR website, where people from all over Berlin can submit their own ideas and statements, often drawn from youth slang and wordplay around trash and recycling. It can get playful: the name of someone you would happily throw out, or terms like Trash Out instead of Crash Out, Trennungsgrund or Glass Skin.","The tool works with five separate waste categories, including glass, where the sorting rules have become stricter this year, packaging and organic waste."],
    ["베를린 청소공사 BSR을 위한 가상의 캠페인을 기획했습니다. 기후 변화와 지구 온난화가 점점 더 시급해지는 지금, 특히 젊은 세대에게 분리배출의 중요성을 알리는 것이 목표입니다.","그 중심에는 ‘쓰레기 알파벳’ 원리로 작동하는 제너레이티브 툴이 있으며, 단어를 포스터와 소셜 미디어 게시물로 바꿉니다. 이 툴이 BSR 웹사이트에 소개되어, 베를린 곳곳의 사람들이 쓰레기와 분리배출에 어울리는 청소년 은어나 말장난으로 자신만의 아이디어와 메시지를 보낼 수 있기를 바랍니다. 버리고 싶은 사람의 이름처럼 유쾌한 방향도 가능하고, Crash Out 대신 Trash Out, Trennungsgrund, Glass Skin 같은 표현도 있습니다.","이 툴은 다섯 가지의 분리된 쓰레기 분류로 작동하며, 올해부터 분리 기준이 더 엄격해진 유리, 포장재, 음식물 쓰레기 등이 포함됩니다."],
    ["Für die BSR, die Berliner Stadtreinigung, haben wir eine fiktive Kampagne entwickelt, die vor allem junge Menschen für Mülltrennung sensibilisieren soll – ein Thema, das durch Klimawandel und Erderwärmung immer wichtiger wird.","Herzstück ist ein generatives Tool nach dem Prinzip eines Müll-Alphabets, das Wörter in Plakate und Social-Media-Posts verwandelt. Unsere Vision: Das Tool lebt auf der BSR-Website, und Menschen aus ganz Berlin reichen eigene Ideen und Statements ein, oft aus Jugendsprache und Wortspielen rund um Müll und Recycling. Das darf auch verspielt sein: der Name von jemandem, den man gern entsorgen würde, oder Begriffe wie Trash Out statt Crash Out, Trennungsgrund oder Glass Skin.","Das Tool arbeitet mit fünf getrennten Abfallkategorien, darunter Glas, bei dem die Trennregeln dieses Jahr strenger geworden sind, Verpackungen und Bioabfall."]],
 nt:["Short-term project week in the fifth semester, in collaboration with Feline Krüger. Made in three days.","5학기 단기 프로젝트 주간, 펠리네 크뤼거와 협업. 3일 동안 제작.","Kurzprojektwoche im fünften Semester, in Zusammenarbeit mit Feline Krüger. Entstanden in drei Tagen."]},
{n:"Infektionskrankheiten",t:[1,9],o:8,y:2025,fm:["Magazine","잡지","Magazin"],ro:["Layout, print, concept","레이아웃, 인쇄, 콘셉트","Layout, Print, Konzept"],sw:"InDesign",vs:"mag_v",st:["mag_v"],after:"magazin-uebersicht.jpg",bg:"#f5bfd9",fg:"#000",
 d:[["For our end-of-semester project, we were asked to design a magazine or book around a given text. We chose infectious diseases, a subject that reaches far beyond hospitals and clinics.","The magazine explains, in plain language, what infections are, how they spread, which diseases have shaped history and how we can protect ourselves. Bold typography, pink and black and a mix of photography and illustration are meant to make the topic inviting: something to leaf through with curiosity, not fear."],

 <p class="fe-cap" id="fecap"></p><ol class="fe-n">${items.map((x,k)=>`<li><a href="#work/${x[1]}">${x[0].n}</a></li>`).join("")}</ol></div></div>`;
 const fe=$("#fe"),st=$("#fest"),els=[...st.querySelectorAll(".fe-i")],names=[...st.querySelectorAll(".fe-n li")];
 const erf=x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x<0?-y:y};
 let V=[],H=0,W=0,hh=0,range=0;
 const KMIN=.16,KMAX=1.85;
 function layout(){
  const hd=document.querySelector("header");hh=hd?hd.offsetHeight:90;document.documentElement.style.setProperty("--hh",hh+"px");st.style.top=hh+"px";st.style.height=(innerHeight-hh)+"px";
  H=Math.max(300,innerHeight-hh);W=st.clientWidth||innerWidth;
  const mob=innerWidth<800,maxW=mob?(W-32)/KMAX:W*.42,gap=H*.035;
  let y=0;V=els.map(e=>{const r=+e.dataset.r;let h=mob?(H-70)/KMAX:H*.5,w=h*r;if(w>maxW){w=maxW;h=w/r}const o={top:y,h,w};y+=h+gap;return o});
  const c0=V[0].top+V[0].h/2,cl=V[V.length-1].top+V[V.length-1].h/2;range=cl-c0;
  fe.style.height=(H+range)+"px";V.c0=c0;
 }
 function frame(){
  feRaf=0;if(!document.body.contains(fe))return;
  const s=Math.min(range,Math.max(0,hh-fe.getBoundingClientRect().top)),focus=V.c0+s,sig=H*.27;
  const Rf=x=>KMIN*x+(KMAX-KMIN)*sig*Math.sqrt(Math.PI)/2*erf(x/sig);

  V.forEach((v,i)=>{const t=H/2+Rf(v.top-focus),b=H/2+Rf(v.top+v.h-focus),k=(b-t)/v.h,e=els[i];
   e.style.transform=`translate3d(0,${t.toFixed(1)}px,0) scale(${k.toFixed(4)})`;e.style.width=v.w+"px";e.style.height=v.h+"px";
   e.style.zIndex=Math.round(k*100);e.style.opacity=b<-20||t>H+20?0:1;
   const d=Math.abs(v.top+v.h/2-focus);if(d<bd){bd=d;best=i}});
  names.forEach((n,i)=>n.classList.toggle("on",i===best));{const cp=document.getElementById("fecap"),it=items[best];if(cp&&it&&cp.dataset.i!=best){cp.dataset.i=best;cp.innerHTML=`<b>${it[0].n}</b><span>${meta(it[0])}</span>`}}
 }
 const req=()=>{if(!feRaf)feRaf=requestAnimationFrame(frame)};

}

 }finally{btn.disabled=false}
});
</script>
